name: pulse_ledger
description: Portfolio demo of an offline-first BLE heart-rate monitor with Firestore sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter_blue_plus: ^2.3.14
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
