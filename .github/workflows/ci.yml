name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - name: Resolve packages
        run: flutter pub get
      - name: Check generated Drift code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
